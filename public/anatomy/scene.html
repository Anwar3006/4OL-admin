<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #scene { width: 100vw; height: 100vh; touch-action: none; }
  #scene canvas { display: block; }
  #bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 18%, #1e293b 0%, #0f172a 55%, #060a14 100%);
  }
  #status {
    position: fixed; left: 14px; top: 14px; right: 148px; z-index: 5;
    border-radius: 999px; background: rgba(15,23,42,0.72); color: #fff;
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1; padding: 10px 12px; text-align: center;
    pointer-events: none; transition: opacity 180ms ease, transform 180ms ease;
  }
  #status.hidden { opacity: 0; transform: translateY(-8px); }
  #loader {
    position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: rgba(6,10,20,0.001);
    pointer-events: none; transition: opacity 320ms ease;
  }
  #loader.hidden { opacity: 0; }
  .loader-ring {
    width: 46px; height: 46px; border-radius: 999px;
    background: conic-gradient(from 0deg, rgba(52,211,153,0) 0%, #34d399 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    animation: loader-spin 900ms linear infinite;
  }
  .loader-label {
    font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase; color: rgba(226,232,240,0.75);
  }
  @keyframes loader-spin { to { transform: rotate(360deg); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="bg"></div>
<div id="scene"></div>
<div id="loader"><div class="loader-ring"></div><div class="loader-label">Loading anatomy</div></div>
<div id="status">Loading anatomy...</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

var container = document.getElementById('scene');
var statusEl = document.getElementById('status');
var loaderEl = document.getElementById('loader');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var DEG = Math.PI / 180;
var query = new URLSearchParams(window.location.search || '');
var initialViewProfile = query.get('view_profile') === 'mobile' ? 'mobile' : 'admin';
var initialDirectControls = query.get('direct_controls') === 'false' ? false : true;

var state = {
  gender: 'female',
  yaw: 0,
  pitch: 0,
  zoom: 1,
  tgt: { x: 0, y: 100, z: 0 },
  viewPan: { x: 0, y: 0, z: 0 },
  viewProfile: initialViewProfile,
  directControls: initialDirectControls,
  fullBodyTarget: { x: 150, y: -50, z: 0 },
  fullBodyDistance: 680,
  bodyMetrics: null,
  shiftX: 0,
  organs: false,
  placement: false,
  focusRegion: null,
  kids: false,
  pins: [],
  modelUrls: {
    female: '/anatomy/models/body-female-skin-standard.glb',
    male: '/anatomy/models/body-male-skin-standard.glb',
    organs: '/anatomy/models/body-organs-standard.glb'
  }
};

// Rendered camera state — eased toward state.* every frame (see updateCamera).
var cam = {
  yaw: 0, pitch: 0, zoom: 1,
  tgt: { x: 0, y: 100, z: 0 },
  pan: { x: 0, y: 0, z: 0 },
  shiftX: 0
};
var camReady = false;

var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 1200);
var raycaster = new THREE.Raycaster();
var pointer = new THREE.Vector2();
var loader = new GLTFLoader();
var clock = new THREE.Clock();
var modelCache = {};
var bodyRoot = null;
var bodyMeshes = [];
var pinGroup = new THREE.Group();
var organGroup = new THREE.Group();
var markerGroup = new THREE.Group();
var shadowGroup = new THREE.Group();
scene.add(shadowGroup);
scene.add(pinGroup);
scene.add(organGroup);
scene.add(markerGroup);

// Note: deliberately no PMREMGenerator/environment map here — it requires
// WebGL2 and reliable shader compilation, which some Android WebView GPU
// drivers don't handle well; the lighting rig below covers materials fine
// without it. envMapIntensity on materials is simply inert without one.
scene.add(new THREE.HemisphereLight(0xdbeafe, 0x0b1220, 0.55));
var key = new THREE.DirectionalLight(0xfff3e0, 1.35);
key.position.set(120, 260, 280);
scene.add(key);
var fill = new THREE.DirectionalLight(0xbfdbfe, 0.4);
fill.position.set(-180, 140, 220);
scene.add(fill);
var rim = new THREE.DirectionalLight(0x7dd3fc, 0.65);
rim.position.set(-220, 220, -260);
scene.add(rim);

var skinColor = new THREE.Color(0.46, 0.255, 0.14);
var kidsColor = new THREE.Color(0.82, 0.46, 0.27);
var highlightMaterial = new THREE.MeshBasicMaterial({
  color: 0x34d399,
  transparent: true,
  opacity: 0.14,
  depthWrite: false
});

var dragging = false;
var moved = 0;
var lastX = 0;
var lastY = 0;
var dragVel = { yaw: 0, pitch: 0 };
var inertia = { yaw: 0, pitch: 0, active: false };
var statusTimer = null;

function setStatus(text, sticky) {
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
  if (statusTimer) window.clearTimeout(statusTimer);
  if (!sticky) {
    statusTimer = window.setTimeout(function () {
      statusEl.classList.add('hidden');
    }, 1400);
  }
}

function setLoading(active, label) {
  if (active) {
    loaderEl.querySelector('.loader-label').textContent = label || 'Loading anatomy';
    loaderEl.classList.remove('hidden');
  } else {
    loaderEl.classList.add('hidden');
  }
}

function send(obj) {
  var msg = JSON.stringify(obj);
  if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    window.ReactNativeWebView.postMessage(msg);
  } else if (window.parent && window.parent !== window) {
    window.parent.postMessage(msg, '*');
  }
}

window.addEventListener('error', function (e) {
  var msg = (e && e.error && e.error.message) || (e && e.message) || 'unknown error';
  setStatus('Scene error: ' + msg, true);
  send({ type: 'model_error', gender: state.gender, message: 'uncaught: ' + msg });
});
window.addEventListener('unhandledrejection', function (e) {
  var reason = e && e.reason;
  var msg = (reason && reason.message) || String(reason);
  setStatus('Scene error: ' + msg, true);
  send({ type: 'model_error', gender: state.gender, message: 'unhandled rejection: ' + msg });
});

function resize() {
  var w = Math.max(container.clientWidth, 1);
  var h = Math.max(container.clientHeight, 1);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

function normalizeBody(root) {
  var wrapper = new THREE.Group();
  wrapper.add(root);

  var box = new THREE.Box3().setFromObject(root);
  var size = box.getSize(new THREE.Vector3());
  var center = box.getCenter(new THREE.Vector3());
  var scale = 200 / Math.max(size.y, 0.0001);
  root.position.x -= center.x;
  root.position.y -= box.min.y;
  root.position.z -= center.z;
  wrapper.scale.setScalar(scale);
  wrapper.updateMatrixWorld(true);

  var normalizedBox = new THREE.Box3().setFromObject(wrapper);
  var normalizedSize = normalizedBox.getSize(new THREE.Vector3());
  var normalizedCenter = normalizedBox.getCenter(new THREE.Vector3());
  wrapper.position.x -= normalizedCenter.x;
  wrapper.position.y -= normalizedBox.min.y;
  wrapper.position.z -= normalizedCenter.z;
  wrapper.updateMatrixWorld(true);

  normalizedBox = new THREE.Box3().setFromObject(wrapper);
  normalizedSize = normalizedBox.getSize(new THREE.Vector3());
  normalizedCenter = normalizedBox.getCenter(new THREE.Vector3());
  state.bodyMetrics = {
    center: { x: normalizedCenter.x, y: normalizedCenter.y, z: normalizedCenter.z },
    size: { x: normalizedSize.x, y: normalizedSize.y, z: normalizedSize.z }
  };
  applyFullBodyFrame();
  window.__anatomyDebug = {
    bodyCenter: state.fullBodyTarget,
    bodyDistance: state.fullBodyDistance,
    bodySize: { x: normalizedSize.x, y: normalizedSize.y, z: normalizedSize.z }
  };
  return wrapper;
}

function frameProfile() {
  if (state.viewProfile === 'mobile') {
    return {
      offsetX: Number(query.get('frame_x') || 95),
      offsetY: Number(query.get('frame_y') || -180),
      minDistance: Number(query.get('frame_distance') || 900),
      yFactor: 3.6,
      xFactor: 10.2
    };
  }
  return { offsetX: 150, offsetY: -150, minDistance: 680, yFactor: 3.4, xFactor: 6.8 };
}

function applyFullBodyFrame() {
  if (!state.bodyMetrics) return;
  var profile = frameProfile();
  var center = state.bodyMetrics.center;
  var size = state.bodyMetrics.size;
  state.fullBodyTarget = {
    x: center.x + profile.offsetX,
    y: center.y + profile.offsetY,
    z: center.z
  };
  state.fullBodyDistance = Math.max(profile.minDistance, size.y * profile.yFactor, size.x * profile.xFactor);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function tuneMaterials(root) {
  root.traverse(function (node) {
    if (!node.isMesh) return;
    node.frustumCulled = true;
    node.material = new THREE.MeshPhysicalMaterial({
      color: state.kids ? kidsColor : skinColor,
      roughness: 0.58,
      metalness: 0,
      sheen: 0.35,
      sheenRoughness: 0.7,
      sheenColor: state.kids ? kidsColor : skinColor,
      clearcoat: 0.05,
      clearcoatRoughness: 0.6,
      envMapIntensity: 0.55,
      side: THREE.FrontSide
    });
  });
}

function collectBodyMeshes(root) {
  bodyMeshes = [];
  root.traverse(function (node) {
    if (node.isMesh) bodyMeshes.push(node);
  });
}

function buildContactShadow() {
  clearGroup(shadowGroup);
  if (!state.bodyMetrics) return;
  var size = state.bodyMetrics.size;
  var canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  var ctx = canvas.getContext('2d');
  var grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.42)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  var texture = new THREE.CanvasTexture(canvas);
  var radius = Math.max(size.x, size.z) * 0.62;
  var mesh = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 48),
    new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(state.bodyMetrics.center.x, 0.3, state.bodyMetrics.center.z);
  shadowGroup.add(mesh);
}

async function loadBody(gender) {
  var url = state.modelUrls[gender] || state.modelUrls.female;
  if (!url) return;
  var firstLoad = !bodyRoot;
  if (firstLoad) setLoading(true, 'Preparing ' + gender + ' model');
  setStatus('Loading ' + gender + ' body...', true);
  try {
    if (!modelCache[gender] || modelCache[gender].url !== url) {
      var gltf = await loader.loadAsync(url);
      var normalizedScene = normalizeBody(gltf.scene);
      tuneMaterials(normalizedScene);
      modelCache[gender] = { url: url, scene: normalizedScene };
    }
    if (bodyRoot) scene.remove(bodyRoot);
    bodyRoot = modelCache[gender].scene;
    tuneMaterials(bodyRoot);
    collectBodyMeshes(bodyRoot);
    scene.add(bodyRoot);
    buildFocusMarker();
    buildContactShadow();
    if (!camReady) { snapCamera(); camReady = true; }
    setStatus(gender.charAt(0).toUpperCase() + gender.slice(1) + ' body ready', false);
    setLoading(false);
    send({ type: 'model_ready', gender: gender });
  } catch (err) {
    setStatus('Could not load anatomy model', true);
    setLoading(false);
    send({ type: 'model_error', gender: gender, message: err && err.message ? err.message : String(err) });
  }
}

// --- Organs (real BodyParts3D-derived geometry, loaded once and reused) ---
var organsGLTFCache = null;
var organsLoadPromise = null;

var ORGAN_NAMES = [
  'heart', 'liver', 'small_intestine', 'large_intestine', 'right_lung', 'left_lung',
  'right_kidney', 'left_kidney', 'brain', 'stomach', 'esophagus'
];

function findOrganName(node) {
  var cursor = node;
  while (cursor) {
    if (cursor.name && ORGAN_NAMES.indexOf(cursor.name) !== -1) return cursor.name;
    cursor = cursor.parent;
  }
  return '';
}

function tuneOrganMaterials(root) {
  var deepRed = new THREE.Color(0.62, 0.19, 0.17);
  var soft = new THREE.Color(0.79, 0.47, 0.42);
  var neutral = new THREE.Color(0.72, 0.6, 0.58);
  root.traverse(function (node) {
    if (!node.isMesh) return;
    var name = findOrganName(node);
    var tint = soft;
    if (name === 'heart' || name === 'right_kidney' || name === 'left_kidney') tint = deepRed;
    if (name === 'brain') tint = neutral;
    node.material = new THREE.MeshPhysicalMaterial({
      color: tint,
      roughness: 0.42,
      metalness: 0,
      clearcoat: 0.25,
      clearcoatRoughness: 0.35,
      transmission: state.viewProfile === 'mobile' ? 0 : 0.08,
      transparent: true,
      opacity: 0.86,
      envMapIntensity: 0.5,
      side: THREE.FrontSide
    });
  });
}

function ensureOrgansLoaded() {
  if (organsGLTFCache) return Promise.resolve(organsGLTFCache);
  if (organsLoadPromise) return organsLoadPromise;
  var url = state.modelUrls.organs;
  if (!url) return Promise.resolve(null);
  organsLoadPromise = loader.loadAsync(url).then(function (gltf) {
    tuneOrganMaterials(gltf.scene);
    organsGLTFCache = gltf.scene;
    return organsGLTFCache;
  }).catch(function (err) {
    send({ type: 'model_error', gender: 'organs', message: err && err.message ? err.message : String(err) });
    return null;
  }).finally(function () {
    organsLoadPromise = null;
  });
  return organsLoadPromise;
}

var organsBuildToken = 0;

async function buildOrgans() {
  var token = ++organsBuildToken;
  clearGroup(organGroup);
  if (!state.organs || state.kids) return;
  var template = await ensureOrgansLoaded();
  // Bail if state changed, or a newer buildOrgans() call has since superseded this one.
  if (!template || token !== organsBuildToken || !state.organs || state.kids) return;
  organGroup.add(template.clone(true));
}

function buildFocusMarker() {
  clearGroup(markerGroup);
  if (!state.focusRegion) return;
  var p = regionTarget(state.focusRegion);
  var marker = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), highlightMaterial);
  marker.position.set(p.x, p.y, p.z);
  marker.scale.set(p.sx, p.sy, p.sz);
  markerGroup.add(marker);
}

function regionTarget(key) {
  var map = {
    head: { x: 0, y: 184, z: 0, sx: 20, sy: 18, sz: 18 },
    neck: { x: 0, y: 164, z: 0, sx: 16, sy: 12, sz: 12 },
    chest: { x: 0, y: 140, z: 0, sx: 32, sy: 26, sz: 18 },
    abdomen: { x: 0, y: 112, z: 0, sx: 30, sy: 26, sz: 18 },
    pelvis: { x: 0, y: 88, z: 0, sx: 30, sy: 18, sz: 18 },
    back: { x: 0, y: 124, z: -8, sx: 30, sy: 48, sz: 10 },
    arm_left: { x: -48, y: 122, z: 0, sx: 18, sy: 44, sz: 18 },
    arm_right: { x: 48, y: 122, z: 0, sx: 18, sy: 44, sz: 18 },
    hand_left: { x: -58, y: 82, z: 2, sx: 14, sy: 14, sz: 14 },
    hand_right: { x: 58, y: 82, z: 2, sx: 14, sy: 14, sz: 14 },
    leg_left: { x: -16, y: 50, z: 0, sx: 16, sy: 46, sz: 16 },
    leg_right: { x: 16, y: 50, z: 0, sx: 16, sy: 46, sz: 16 },
    foot_left: { x: -16, y: 5, z: 8, sx: 16, sy: 8, sz: 18 },
    foot_right: { x: 16, y: 5, z: 8, sx: 16, sy: 8, sz: 18 }
  };
  return map[key] || { x: 0, y: 105, z: 0, sx: 28, sy: 28, sz: 18 };
}

function classifyPoint(point) {
  var x = point.x;
  var y = point.y;
  var ax = Math.abs(x);
  var side = x < 0 ? 'left' : 'right';
  if (y >= 168) return { region: 'head', part: 'head' };
  if (y >= 155 && ax < 18) return { region: 'neck', part: 'neck' };
  if (ax > 34 && y >= 86) {
    if (y < 94 || ax > 56) return { region: 'hand_' + side, part: 'hand' };
    return { region: 'arm_' + side, part: y > 123 ? 'arm' : 'forearm' };
  }
  if (y >= 126) return { region: 'chest', part: 'chest' };
  if (y >= 100) return { region: 'abdomen', part: 'abdomen' };
  if (y >= 78) return { region: 'pelvis', part: 'pelvis' };
  if (y >= 14) return { region: 'leg_' + side, part: y > 48 ? 'thigh' : 'calf' };
  return { region: 'foot_' + side, part: 'foot' };
}

// --- Camera: eased/damped toward state.* targets (see animate()) ---
function snapCamera() {
  cam.yaw = state.yaw;
  cam.pitch = state.pitch;
  cam.zoom = state.zoom;
  cam.tgt.x = state.tgt.x; cam.tgt.y = state.tgt.y; cam.tgt.z = state.tgt.z;
  cam.pan.x = state.viewPan.x; cam.pan.y = state.viewPan.y; cam.pan.z = state.viewPan.z;
  cam.shiftX = state.shiftX;
}

function dampCamera(dt) {
  var lambdaFast = 8;
  var lambdaSlow = 5;
  cam.yaw = THREE.MathUtils.damp(cam.yaw, state.yaw, lambdaFast, dt);
  cam.pitch = THREE.MathUtils.damp(cam.pitch, state.pitch, lambdaFast, dt);
  cam.zoom = THREE.MathUtils.damp(cam.zoom, state.zoom, lambdaSlow, dt);
  cam.tgt.x = THREE.MathUtils.damp(cam.tgt.x, state.tgt.x, lambdaSlow, dt);
  cam.tgt.y = THREE.MathUtils.damp(cam.tgt.y, state.tgt.y, lambdaSlow, dt);
  cam.tgt.z = THREE.MathUtils.damp(cam.tgt.z, state.tgt.z, lambdaSlow, dt);
  cam.pan.x = THREE.MathUtils.damp(cam.pan.x, state.viewPan.x, lambdaSlow, dt);
  cam.pan.y = THREE.MathUtils.damp(cam.pan.y, state.viewPan.y, lambdaSlow, dt);
  cam.pan.z = THREE.MathUtils.damp(cam.pan.z, state.viewPan.z, lambdaSlow, dt);
  cam.shiftX = THREE.MathUtils.damp(cam.shiftX, state.shiftX, lambdaSlow, dt);
}

function updateCamera() {
  var isFullBody = (cam.zoom || 1) <= 1.05 && !state.focusRegion;
  var baseTarget = isFullBody ? state.fullBodyTarget : cam.tgt;
  var target = new THREE.Vector3(baseTarget.x || 0, baseTarget.y || 100, baseTarget.z || 0);
  target.add(new THREE.Vector3(cam.pan.x || 0, cam.pan.y || 0, cam.pan.z || 0));
  var pitch = Math.max(-35, Math.min(35, cam.pitch)) * DEG;
  var yaw = cam.yaw * DEG;
  var baseDistance = isFullBody ? state.fullBodyDistance : 280;
  var distance = baseDistance / Math.max(cam.zoom || 1, 0.2);
  var offset = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch) * distance,
    Math.sin(pitch) * distance,
    Math.cos(yaw) * Math.cos(pitch) * distance
  );
  var right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  target.addScaledVector(right, -(cam.shiftX || 0) / Math.max(cam.zoom || 1, 1) * 0.18);
  camera.position.copy(target).add(offset);
  camera.lookAt(target);
  camera.near = Math.max(distance / 120, 0.1);
  camera.far = 1200;
  camera.updateProjectionMatrix();
}

function clearGroup(group) {
  group.traverse(function (child) {
    if (child === group) return;
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (child.material.map) child.material.map.dispose();
      child.material.dispose();
    }
  });
  while (group.children.length) {
    group.children.pop();
  }
}

function makePinLabel(text, locked) {
  if (!text) return null;
  var canvas = document.createElement('canvas');
  canvas.width = 280;
  canvas.height = 84;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  var label = String(text).slice(0, 24);
  var textWidth = Math.min(ctx.measureText(label).width, 220);
  var boxWidth = Math.max(100, textWidth + (locked ? 60 : 40));
  var x = (canvas.width - boxWidth) / 2;
  var y = 18;
  var width = boxWidth;
  var height = 44;
  var radius = 22;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(8,13,26,0.82)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = locked ? 'rgba(245,158,11,0.55)' : 'rgba(52,211,153,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + radius, y + 1);
  ctx.lineTo(x + width - radius, y + 1);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = locked ? '#fbbf24' : '#34d399';
  ctx.beginPath();
  ctx.arc(x + 18, y + height / 2, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 30, y + height / 2 + 1, boxWidth - 40);
  var texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  var material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false,
    depthWrite: false
  });
  var sprite = new THREE.Sprite(material);
  sprite.renderOrder = 30;
  // Fixed height, width scaled to the drawn box so labels stay readable regardless of text length.
  sprite.scale.set(9 * (boxWidth / 44), 9, 1);
  return sprite;
}

function cylinderBetween(a, b, radius, material) {
  var dir = new THREE.Vector3().subVectors(b, a);
  var geo = new THREE.CylinderGeometry(radius, radius, Math.max(dir.length(), 0.01), 18, 1);
  var mesh = new THREE.Mesh(geo, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}

function buildPins() {
  clearGroup(pinGroup);
  var dotGeo = new THREE.SphereGeometry(1.6, 20, 12);
  var glowGeo = new THREE.RingGeometry(2.2, 4.2, 28);
  var dotMatEmerald = new THREE.MeshPhysicalMaterial({ color: 0x34d399, roughness: 0.3, clearcoat: 0.6, emissive: 0x065f46, emissiveIntensity: 0.4 });
  var dotMatAmber = new THREE.MeshPhysicalMaterial({ color: 0xfbbf24, roughness: 0.3, clearcoat: 0.6, emissive: 0x78350f, emissiveIntensity: 0.4 });
  var glowMatEmerald = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.55, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
  var glowMatAmber = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.55, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
  var leaderMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });

  for (var i = 0; i < state.pins.length; i++) {
    var pin = state.pins[i];
    var locked = !!pin.locked;
    var group = new THREE.Group();
    var origin = new THREE.Vector3(Number(pin.x) || 0, Number(pin.y) || 0, Number(pin.z) || 0);
    group.position.copy(origin);
    group.userData = { id: pin.id, body_part_id: pin.body_part_id, pin: true };

    var dot = new THREE.Mesh(dotGeo, locked ? dotMatAmber : dotMatEmerald);
    dot.userData = group.userData;
    group.add(dot);

    var glow = new THREE.Mesh(glowGeo, locked ? glowMatAmber : glowMatEmerald);
    glow.userData = group.userData;
    glow.renderOrder = 20;
    group.add(glow);

    var labelOffset = new THREE.Vector3(0, 7.5, 2.2);
    var leader = cylinderBetween(new THREE.Vector3(0, 0.4, 0.2), labelOffset.clone().multiplyScalar(0.85), 0.12, leaderMat);
    group.add(leader);

    var label = makePinLabel(pin.label || pin.name, locked);
    if (label) {
      label.position.copy(labelOffset);
      group.add(label);
    }
    pinGroup.add(group);
  }
}

// --- Camera drag (rotate) with release momentum ---
function setPointer(clientX, clientY) {
  var rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
}

function raycastPins() {
  var meshes = [];
  pinGroup.traverse(function (node) {
    if (node.isMesh) meshes.push(node);
  });
  return raycaster.intersectObjects(meshes, false);
}

function handleTap(clientX, clientY) {
  setPointer(clientX, clientY);
  raycaster.setFromCamera(pointer, camera);
  var pinHits = raycastPins();
  if (!state.placement && pinHits.length > 0) {
    var pin = pinHits[0].object.userData || {};
    send({ type: 'pin_tapped', id: pin.id, body_part_id: pin.body_part_id });
    return;
  }
  var bodyHits = raycaster.intersectObjects(bodyMeshes, true);
  if (bodyHits.length > 0) {
    var point = bodyHits[0].point;
    var hit = classifyPoint(point);
    if (state.placement) {
      send({
        type: 'placement',
        x: Math.round(point.x * 10) / 10,
        y: Math.round(point.y * 10) / 10,
        z: Math.round(point.z * 10) / 10,
        region: hit.region,
        part: hit.part
      });
    } else {
      send({ type: 'region_tapped', region: hit.region, part: hit.part });
    }
    return;
  }
  send({ type: 'empty_tapped' });
}

function pos(e) {
  var touch = e.touches && e.touches.length ? e.touches[0] : e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e;
  return { x: touch.clientX, y: touch.clientY };
}

function onDown(e) {
  dragging = true;
  moved = 0;
  inertia.active = false;
  dragVel.yaw = 0;
  dragVel.pitch = 0;
  var p = pos(e);
  lastX = p.x;
  lastY = p.y;
}

function onMove(e) {
  if (!dragging) return;
  var p = pos(e);
  var dx = p.x - lastX;
  var dy = p.y - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastX = p.x;
  lastY = p.y;
  if (!state.directControls) return;
  var dYaw = dx * 0.45;
  var dPitch = -dy * 0.22;
  state.yaw += dYaw;
  state.pitch = Math.max(-35, Math.min(35, state.pitch + dPitch));
  dragVel.yaw = dragVel.yaw * 0.6 + dYaw * 0.4;
  dragVel.pitch = dragVel.pitch * 0.6 + dPitch * 0.4;
}

function onUp(e) {
  if (!dragging) return;
  dragging = false;
  if (moved < 8) {
    var p = pos(e);
    handleTap(p.x, p.y);
  } else if (state.directControls) {
    inertia.yaw = dragVel.yaw;
    inertia.pitch = dragVel.pitch;
    inertia.active = Math.abs(inertia.yaw) + Math.abs(inertia.pitch) > 0.01;
  }
}

renderer.domElement.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
renderer.domElement.addEventListener('touchstart', function (e) { onDown(e); }, { passive: true });
renderer.domElement.addEventListener('touchmove', function (e) { onMove(e); e.preventDefault(); }, { passive: false });
renderer.domElement.addEventListener('touchend', onUp);

function handle(m) {
  if (!m || !m.type) return;
  switch (m.type) {
    case 'init':
      if (m.model_urls) state.modelUrls = Object.assign({}, state.modelUrls, m.model_urls);
      if (m.view_profile) state.viewProfile = m.view_profile;
      if (typeof m.direct_controls === 'boolean') state.directControls = m.direct_controls;
      applyFullBodyFrame();
      if (m.gender) state.gender = m.gender;
      if (Array.isArray(m.pins)) state.pins = m.pins;
      if (typeof m.organs === 'boolean') state.organs = m.organs;
      if (typeof m.placement === 'boolean') state.placement = m.placement;
      if (typeof m.kids === 'boolean') state.kids = m.kids;
      buildPins();
      buildOrgans();
      loadBody(state.gender);
      break;
    case 'set_models':
      if (m.model_urls) state.modelUrls = Object.assign({}, state.modelUrls, m.model_urls);
      loadBody(state.gender);
      break;
    case 'set_view_profile':
      state.viewProfile = m.profile || 'admin';
      if (typeof m.direct_controls === 'boolean') state.directControls = m.direct_controls;
      applyFullBodyFrame();
      break;
    case 'pan_screen':
      state.viewPan.x -= (Number(m.x) || 0) / Math.max(state.zoom || 1, 1);
      state.viewPan.y -= (Number(m.y) || 0) / Math.max(state.zoom || 1, 1);
      state.viewPan.z -= (Number(m.z) || 0) / Math.max(state.zoom || 1, 1);
      break;
    case 'zoom_step':
      state.zoom = clamp((state.zoom || 1) + (Number(m.delta) || 0), 0.72, 4);
      break;
    case 'rotate_yaw':
      state.yaw += Number(m.delta) || 0;
      break;
    case 'recenter_view':
      state.viewPan = { x: 0, y: 0, z: 0 };
      state.zoom = 1;
      state.pitch = 0;
      state.yaw = 0;
      applyFullBodyFrame();
      break;
    case 'set_gender':
      state.gender = m.gender || 'female';
      loadBody(state.gender);
      break;
    case 'set_pins':
      state.pins = Array.isArray(m.pins) ? m.pins : [];
      buildPins();
      break;
    case 'set_organs':
      state.organs = !!m.visible;
      buildOrgans();
      break;
    case 'set_kids':
      state.kids = !!m.on;
      if (state.kids) state.organs = false;
      if (bodyRoot) tuneMaterials(bodyRoot);
      buildOrgans();
      break;
    case 'set_placement':
      state.placement = !!m.on;
      setStatus(state.placement ? 'Placement mode: tap the body to capture coordinates' : 'Placement off', false);
      break;
    case 'set_focus_region':
      state.focusRegion = m.key || null;
      buildFocusMarker();
      break;
    case 'shift_model':
      state.shiftX = Number(m.x) || 0;
      break;
    case 'zoom_region':
      state.zoom = Number(m.zoom) || 2.2;
      state.tgt = { x: Number(m.x) || 0, y: Number(m.y) || 120, z: Number(m.z) || 0 };
      state.viewPan = { x: 0, y: 0, z: 0 };
      if (typeof m.yaw === 'number') state.yaw = m.yaw;
      state.focusRegion = m.key || state.focusRegion;
      state.pins = Array.isArray(m.pins) ? m.pins : state.pins;
      buildPins();
      buildFocusMarker();
      break;
    case 'reset_view':
      state.zoom = 1;
      state.viewPan = { x: 0, y: 0, z: 0 };
      applyFullBodyFrame();
      state.tgt = state.fullBodyTarget || { x: 0, y: 100, z: 0 };
      state.yaw = 0;
      state.pitch = 0;
      state.focusRegion = null;
      state.pins = [];
      buildPins();
      buildFocusMarker();
      break;
  }
}

window.__recv = handle;
window.addEventListener('message', function (e) {
  try {
    var data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    handle(data);
  } catch (err) {}
});

var animateErrorReported = false;

function animate() {
  try {
    var dt = clock.getDelta();
    if (inertia.active) {
      state.yaw += inertia.yaw;
      state.pitch = Math.max(-35, Math.min(35, state.pitch + inertia.pitch));
      inertia.yaw *= 0.92;
      inertia.pitch *= 0.92;
      if (Math.abs(inertia.yaw) + Math.abs(inertia.pitch) < 0.01) inertia.active = false;
    }
    dampCamera(dt);
    updateCamera();
    pinGroup.children.forEach(function (pin) {
      var glow = pin.children[1];
      if (glow) {
        var pulse = 1 + 0.18 * Math.sin(Date.now() / 320);
        glow.scale.setScalar(pulse);
      }
    });
    renderer.render(scene, camera);
  } catch (err) {
    // Surface a render-loop crash instead of a silent blank canvas.
    if (!animateErrorReported) {
      animateErrorReported = true;
      var msg = err && err.message ? err.message : String(err);
      setStatus('Render error: ' + msg, true);
      send({ type: 'model_error', gender: state.gender, message: 'render loop: ' + msg });
    }
  }
}

renderer.setAnimationLoop(animate);
send({ type: 'ready' });
window.setTimeout(function () {
  if (!bodyRoot && !(window.ReactNativeWebView && window.ReactNativeWebView.postMessage)) {
    loadBody(state.gender);
  }
}, 350);
</script>
</body>
</html>
