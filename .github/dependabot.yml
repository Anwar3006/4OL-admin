# Dependabot — keeps npm dependencies current so security patches
# land without manual sweeps. Grouped minor/patch updates to limit
# PR noise; security alerts arrive immediately regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
