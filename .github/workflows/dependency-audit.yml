# Dependency scanning — security audit follow-up.
# Runs `npm audit` on pushes/PRs and weekly, so high/critical known
# vulnerabilities in the dependency tree surface automatically.
name: Dependency Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high
